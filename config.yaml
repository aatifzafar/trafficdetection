app:
  name: "AI-Driven Smart Traffic Violation Detection and Alert System"
  version: "1.0.0"
  demo_mode: true
  device: "auto" # "cuda", "cpu", or "auto"
  log_level: "INFO"

detection:
  model_traffic: "models/yolo26n.pt"
  model_custom: "models/traffic_custom.pt"
  model_triple: "models/triple_riding_best.pt"  # team's triple-riding model (only its triple/phone classes are used)
  model_seatbelt: "models/seatbelt_best.pt"
  model_helmet: "models/helmet_model.pt"
  model_plate: "models/plate_model.pt"
  confidence: 0.35
  iou: 0.45
  input_size: 640
  custom_imgsz: 832          # helmet / plate model image size: 832 more accurate, 640 faster (Settings page)
  triple_every_n_frames: 2  # triple-riding model runs every 2nd frame, boxes reused in between (speed)

tracking:
  algorithm: "bytetrack" # "bytetrack" or "deepsort"
  track_thresh: 0.35
  track_buffer: 30
  match_thresh: 0.8

association:
  spatial_iou_threshold: 0.15
  max_rider_bike_distance: 120 # pixels

ocr:
  engine: "easyocr" # "easyocr", "paddleocr", "tesseract"
  languages: ["en"]
  multi_frame_voting: true
  min_confidence: 0.4
  plate_regex: "^[A-Z]{2}[0-9]{1,2}[A-Z]{0,3}[0-9]{4}$" # Indian vehicle registration pattern

violations:
  helmet: true
  # The edge-count fallback flags almost every rider (helmet or not). Keep false until
  # models/traffic_custom.pt is trained; with the model present this setting is ignored.
  helmet_baseline: false
  triple_riding: true
  red_light: true
  wrong_way: true
  seatbelt: true       # Custom YOLO26n seatbelt model (models/seatbelt_best.pt)
  seatbelt_confidence: 0.35
  mobile_phone: false  # phones are too small to see reliably from CCTV (future work)
  illegal_parking: true   # needs a no-parking zone drawn on the Camera setup page
  parking_max_seconds: 60 # a vehicle still inside a no-parking zone longer than this is flagged
  parking_move_tolerance_px: 25
  unsafe_movement: true   # weaving (zig-zag) from the tracked path; over-speeding only with pixels_per_meter
  speed_limit_kmph: 40
  weave_min_direction_changes: 2
  weave_amplitude_ratio: 0.35  # side-to-side swing, in vehicle widths

temporal_confirmation:
  window: 10
  minimum_positive_frames: 6
  violation_cooldown_seconds: 10

evidence:
  pre_seconds: 4
  post_seconds: 4
  fps_fallback: 25
  save_dir: "data/evidence"

database:
  url: "sqlite:///./data/traffic_system.db" # Fallback SQLite, or "postgresql://user:password@localhost:5432/traffic_db"

alerts:
  enable_console: true
  enable_dashboard: true
  enable_sms: false
  sms_provider: "mock" # "twilio", "fast2sms", "mock"
  enable_email: false

cameras:
  default_stop_line:
    x1: 150
    y1: 520
    x2: 1100
    y2: 520
  default_lane_direction: [0, 1] # Primary flow vector [dx, dy] (downward)
  max_angle_deviation_deg: 120 # degrees before flagged as wrong-way
  default_perspective: "AUTO" # "AUTO", "FRONT", "SIDE"
  seatbelt_min_crop_px: 90
  seatbelt_min_sharpness: 30.0
  default_no_parking_zones: []   # polygons [[x, y], ...] in image pixels; set per camera on Camera setup
  default_pixels_per_meter: null # set per camera to enable over-speed checks

# Per-camera calibration. The dashboard's Camera setup page writes it to data/camera_calibration.yaml
# (that file wins over this block). Keys are camera ids from the database. Each may contain:
#   stop_line: {x1, y1, x2, y2}   lane_direction: [dx, dy]   signal_roi: [x1, y1, x2, y2]
#   rules: {helmet, triple_riding, red_light, wrong_way, seatbelt}   night_mode: true|false
camera_calibration: {}

# Duplicate merging: same plate (or same tracked vehicle) + same violation on the same camera
# within this many seconds of video becomes one record (merged_count is increased instead).
dedup_window_seconds: 300
